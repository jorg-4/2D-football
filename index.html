<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitch Duel</title>
    <style>
      :root {
        --pitch-deep: #0e2b1f;
        --pitch-light: #14391f;
        --line-white: rgba(255, 255, 255, 0.55);
        --player-1: #3d7bfe;
        --player-2: #e8453a;
        --ball: #fafafa;
        --accent: #f5c518;
        --ui-bg: #0a0a0b;
        --ui-fg: #f2f2f2;
        --ui-muted: #8a8a8e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ui-bg);
        color: var(--ui-fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
